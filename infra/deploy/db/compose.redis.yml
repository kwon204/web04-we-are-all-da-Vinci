name: "daVinci-deploy-redis"

services:
  redis:
    image: "redis:7.4-alpine"
    container_name: daVinci-redis
    restart: unless-stopped
    env_file: .env.redis
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    networks:
      - daVinci-web-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli  ping | grep PONG"]
      interval: 5s
      timeout: 30s
      retries: 3

volumes:
  redis_data:

networks:
  daVinci-web-network:
    external: true
    name: daVinci-web-network
